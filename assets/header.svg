<svg width="1000" height="260" viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117">
        <animate attributeName="stop-color" values="#0d1117;#0b1e33;#1a0d33;#0d1117" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="55%" stop-color="#0f2942">
        <animate attributeName="stop-color" values="#0f2942;#13284a;#3a1568;#0f2942" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#1a0d33">
        <animate attributeName="stop-color" values="#1a0d33;#0d1117;#0b1e33;#1a0d33" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="textGrad" gradientUnits="userSpaceOnUse" x1="-400" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#00A6ED"/>
      <stop offset="50%" stop-color="#e6d8ff"/>
      <stop offset="100%" stop-color="#6C3CE1"/>
      <animate attributeName="x1" values="-400;1400;-400" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;1800;0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="roundedBg">
      <rect width="1000" height="260" rx="18" ry="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#roundedBg)">
    <rect width="1000" height="260" fill="url(#bgGrad)"/>

    <circle cx="60" cy="240" r="2.4" fill="#00A6ED">
      <animate attributeName="cy" values="240;-10" dur="6s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="6s" begin="0s" repeatCount="indefinite"/>
    </circle>
