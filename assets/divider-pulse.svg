<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 32" width="1000" height="32" role="img" aria-label="Animated heartbeat divider" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="base" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="0"><stop offset="0" stop-color="#30363d" stop-opacity="0"/><stop offset="0.5" stop-color="#30363d"/><stop offset="1" stop-color="#30363d" stop-opacity="0"/></linearGradient>
<linearGradient id="run" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="0"><stop offset="0" stop-color="#6C3CE1"/><stop offset="1" stop-color="#00A6ED"/></linearGradient>
<filter id="glow" x="-10%" y="-100%" width="120%" height="300%"><feGaussianBlur stdDeviation="2.5"/></filter>
</defs>
<path d="M0 16 H400 L412 16 L420 8 L430 24 L440 3 L452 29 L462 16 L474 16 L482 11 L492 16 H1000" pathLength="1000" fill="none" stroke="url(#base)" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M0 16 H400 L412 16 L420 8 L430 24 L440 3 L452 29 L462 16 L474 16 L482 11 L492 16 H1000" pathLength="1000" fill="none" stroke="url(#run)" stroke-width="4" stroke-linecap="round" stroke-dasharray="110 890" filter="url(#glow)"><animate attributeName="stroke-dashoffset" from="110" to="-890" dur="3.4s" repeatCount="indefinite"/></path>
<path d="M0 16 H400 L412 16 L420 8 L430 24 L440 3 L452 29 L462 16 L474 16 L482 11 L492 16 H1000" pathLength="1000" fill="none" stroke="url(#run)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="110 890"><animate attributeName="stroke-dashoffset" from="110" to="-890" dur="3.4s" repeatCount="indefinite"/></path>
</svg>
