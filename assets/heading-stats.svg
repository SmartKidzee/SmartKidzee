<svg width="340" height="56" viewBox="0 0 340 56" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="grad_stats" gradientUnits="userSpaceOnUse" x1="-200" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#00A6ED"/>
      <stop offset="50%" stop-color="#e6d8ff"/>
      <stop offset="100%" stop-color="#6C3CE1"/>
      <animate attributeName="x1" values="-200;540;-200" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;740;0" dur="4.5s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow_stats" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <circle cx="14" cy="26" r="5" fill="#00A6ED">
    <animate attributeName="r" values="5;6.5;5" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.55;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>

  <text x="34" y="34" font-family="'Fira Code','Courier New',monospace" font-size="26" font-weight="700"
        fill="url(#grad_stats)" filter="url(#glow_stats)">stats</text>

  <rect x="34" y="44" width="0" height="3" rx="1.5" fill="url(#grad_stats)">
    <animate attributeName="width" values="0;135;135;0" keyTimes="0;0.35;0.85;1" dur="4.5s" repeatCount="indefinite"/>
  </rect>
</svg>